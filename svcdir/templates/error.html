<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ title }}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
<header><h1>{{ title }}</h1></header>
<main>
  <section class="card">
    <p><strong>HTTP {{ status }}</strong> · <span class="mono">{{ error.code }}</span></p>
    <p>{{ error.message }}</p>
    {% if error.details %}
    <ul>{% for d in error.details %}<li class="mono small">{{ d }}</li>{% endfor %}</ul>
    {% endif %}
    <p><a href="{{ url_for('index') }}">返回目录页面</a></p>
  </section>
</main>
</body>
</html>
